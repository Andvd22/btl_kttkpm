<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container narrow">
    <h1>Đăng nhập hệ thống</h1>
    <p>Tài khoản mẫu: <strong>dovanan</strong> / <strong>123@n</strong></p>
    <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="card">
        <label>Username</label>
        <input type="text" th:field="*{username}">
        <small class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>

        <label>Password</label>
        <input type="password" th:field="*{password}">
        <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

        <p class="error" th:if="${error}" th:text="${error}"></p>
        <button type="submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
